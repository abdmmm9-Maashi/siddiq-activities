<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>النشاط الطلابي – ثانوية الصديق بخميس مشيط</title>
<meta name="description" content="موقع النشاط الطلابي في ثانوية الصديق بخميس مشيط: فعاليات، مسابقات، وإنجازات">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--main:#1BB5C9;--dark:#0E7C8C;--white:#fff;--light:#F4FAFB;--text:#18363b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;color:var(--text);background:var(--white);line-height:1.7}
a{text-decoration:none;color:inherit}
.container{max-width:1100px;margin:auto;padding:0 20px}
header{background:linear-gradient(135deg,var(--dark),var(--main));color:var(--white);position:sticky;top:0;z-index:10}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.brand img{height:46px;display:none}
.menu{display:flex;gap:14px;flex-wrap:wrap;font-size:.92rem}
.menu a:hover,.menu a.on{text-decoration:underline}
.burger{display:none;background:none;border:2px solid #fff;color:#fff;border-radius:8px;padding:4px 10px;font-size:1.2rem;cursor:pointer}
.btns{display:flex;gap:8px}
.btn{display:inline-block;padding:9px 20px;border-radius:24px;font-weight:700;border:2px solid var(--white);cursor:pointer;font-family:inherit;font-size:.95rem}
.btn-white{background:var(--white);color:var(--dark)}
.btn-line{background:transparent;color:var(--white)}
.btn-main{background:var(--main);color:#fff;border-color:var(--main)}
.btn-red{background:#fff;color:#b33;border-color:#b33;padding:3px 12px;font-size:.8rem}
.hero{background:linear-gradient(135deg,var(--main),var(--dark));color:var(--white);text-align:center;padding:80px 0}
.hero h1{font-size:2.4rem;margin-bottom:10px}
.hero p{font-size:1.15rem;margin-bottom:26px;opacity:.95}
.hero .btn{margin:4px}
.page{display:none}.page.show{display:block}
section{padding:46px 0}
section.alt{background:var(--light)}
h2{color:var(--dark);margin-bottom:24px;font-size:1.6rem;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.card{background:var(--white);border:2px solid var(--main);border-radius:14px;padding:22px;text-align:center;box-shadow:0 4px 14px rgba(14,124,140,.08)}
.card h3{color:var(--dark);margin-bottom:6px}
.card small{color:#5c7a7f;display:block}
.stat b{display:block;font-size:2rem;color:var(--main)}
.img-ph{height:130px;background:var(--light);border-radius:10px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;color:#7aa;font-size:.9rem}
.gifted{background:linear-gradient(135deg,var(--dark),var(--main));color:var(--white);border-radius:18px;padding:36px;text-align:center}
.gifted h2{color:var(--white)}
.box{background:#fff;border:2px solid var(--main);border-radius:14px;padding:26px;max-width:560px;margin:auto}
label{display:block;margin:10px 0 4px;font-weight:700;color:var(--dark)}
input,select,textarea{width:100%;padding:10px;border:1px solid #9cc;border-radius:8px;font-family:inherit;font-size:1rem}
.box .btn{margin-top:16px}
.msg{margin-top:12px;padding:10px;border-radius:8px;background:#e6f8fa;color:var(--dark);display:none}
.warn{background:#fff8e1;border:1px solid #f0c040;border-radius:10px;padding:12px;margin-bottom:18px;font-size:.9rem}
table{width:100%;border-collapse:collapse;background:#fff;font-size:.92rem}
th,td{border:1px solid #cde;padding:8px;text-align:start}
th{background:var(--dark);color:#fff}
.tablewrap{overflow-x:auto}
.count{font-size:1.6rem;color:var(--main);font-weight:700}
.footer{background:var(--dark);color:var(--white);padding:36px 0 18px}
.footer .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:18px}
.footer h4{margin-bottom:8px}
.footer li{list-style:none}
.note{border-top:1px solid rgba(255,255,255,.3);padding-top:14px;font-size:.85rem;text-align:center;opacity:.9}
@media(max-width:800px){.hero h1{font-size:1.7rem}.burger{display:block}.menu{display:none;width:100%;flex-direction:column}.menu.open{display:flex}}
</style>
</head>
<body>

  <button class="burger" onclick="document.getElementById('menu').classList.toggle('open')">☰</button>

<script>
let ar=true;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const defEvents=[
 {id:1,ar:'مسابقة القرآن الكريم',en:'Holy Quran Competition',date:'',teacher:'',cat:'activity'},
 {id:2,ar:'مسابقة اقرأ',en:'Iqra Competition',date:'',teacher:'',cat:'activity'},
 {id:3,ar:'فعالية اليوم الوطني',en:'National Day Event',date:'',teacher:'',cat:'activity'},
 {id:4,ar:'فعالية الموهوبين التعريفية',en:'Gifted Introductory Event',date:'',teacher:'',cat:'gifted'}
];
let events=load('events',defEvents), regs=load('regs',[]);
let user=null; try{user=JSON.parse(sessionStorage.getItem('user'))}catch(e){}
const roleName={admin:['مشرف النشاط','Supervisor'],team:['فريق النشاط','Team'],teacher:['معلم مشرف','Teacher'],gifted:['منسق الموهوبين','Gifted coordinator'],student:['طالب','Student']};
const T=(a,e)=>ar?a:e;

function evCard(e){
 return '<div class="card"><div class="img-ph">'+T('صورة الفعالية','Event photo')+'</div><h3>'+esc(ar?e.ar:(e.en||e.ar))+'</h3><small>'+esc(e.date||T('التاريخ يُحدَّد لاحقاً','Date TBD'))+'</small><small>'+T('المعلم المشرف: ','Teacher: ')+esc(e.teacher||'—')+'</small></div>';
}
function daysTo(m,d){const n=new Date(),t=new Date(n.getFullYear(),m,d);if(t<new Date(n.getFullYear(),n.getMonth(),n.getDate()))t.setFullYear(n.getFullYear()+1);return Math.ceil((t-n)/864e5)}
function render(){
 $('homeEv').innerHTML=events.filter(e=>e.cat==='activity').slice(-3).reverse().map(evCard).join('');
 $('evList').innerHTML=events.filter(e=>e.cat==='activity').map(evCard).join('');
 $('giftedEv').innerHTML=events.filter(e=>e.cat==='gifted').map(evCard).join('')||'<p style="text-align:center">'+T('لا توجد فعاليات بعد','No events yet')+'</p>';
 const sel=$('regEvent'),cur=sel.value;
 sel.innerHTML=events.map(e=>'<option value="'+e.id+'">'+esc(ar?e.ar:(e.en||e.ar))+'</option>').join('');
 if(cur)sel.value=cur;
 $('sEv').textContent=events.length;$('sReg').textContent=regs.length;
 const oc=[[T('اليوم الوطني (23 سبتمبر)','National Day (23 Sep)'),8,23],[T('يوم التأسيس (22 فبراير)','Founding Day (22 Feb)'),1,22],[T('يوم العلم (11 مارس)','Flag Day (11 Mar)'),2,11]];
 $('occasions').innerHTML=oc.map(o=>'<div class="card"><h3>'+o[0]+'</h3><div class="count">'+daysTo(o[1],o[2])+'</div><small>'+T('يوم متبقٍ','days left')+'</small></div>').join('');
 renderDash();
}
function canAdd(){return user&&user.role!=='student'}
function renderDash(){
 if(!user){$('dashWho').textContent=T('الرجاء تسجيل الدخول أولاً.','Please login first.');$('addBox').style.display='none';$('regRows').innerHTML='';return}
 $('dashWho').textContent=T('مرحباً ','Welcome ')+user.name+' – '+roleName[user.role][ar?0:1];
 $('addBox').style.display=canAdd()?'block':'none';
 let list=regs;
 if(user.role==='student')list=regs.filter(r=>r.name===user.name);
 $('regRows').innerHTML=list.map(r=>{
  const ev=events.find(e=>e.id==r.eventId);
  return '<tr><td>'+esc(ev?(ar?ev.ar:(ev.en||ev.ar)):'—')+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.grade)+'</td><td>'+esc(r.note)+'</td><td>'+(user.role==='admin'?'<button class="btn btn-red" onclick="delReg('+r.id+')">'+T('حذف','Delete')+'</button>':'')+'</td></tr>';
 }).join('')||'<tr><td colspan="5">'+T('لا توجد تسجيلات','No registrations')+'</td></tr>';
}
function delReg(id){regs=regs.filter(r=>r.id!==id);save('regs',regs);render()}
function logout(){user=null;sessionStorage.removeItem('user');$('loginBtn').href='#/login';updLogin();location.hash='#/home'}
function updLogin(){const b=$('loginBtn');if(user){b.href='#/dash';b.textContent=T('لوحة التحكم','Dashboard')}else{b.href='#/login';b.textContent=T('تسجيل الدخول','Login')}}

$('regForm').onsubmit=e=>{e.preventDefault();
 regs.push({id:Date.now(),eventId:$('regEvent').value,name:$('regName').value.trim(),grade:$('regGrade').value,note:$('regNote').value.trim()});
 save('regs',regs);e.target.reset();const m=$('regMsg');m.style.display='block';m.textContent=T('تم حفظ التسجيل (تجريبياً). شكراً لك!','Registration saved (demo). Thank you!');render();
};
$('loginForm').onsubmit=e=>{e.preventDefault();
 user={name:$('uName').value.trim(),role:$('uRole').value};sessionStorage.setItem('user',JSON.stringify(user));updLogin();render();location.hash='#/dash';
};
$('evForm').onsubmit=e=>{e.preventDefault();
 if(!canAdd())return;
 events.push({id:Date.now(),ar:$('evAr').value.trim(),en:$('evEn').value.trim(),date:$('evDate').value,teacher:$('evTeacher').value.trim(),cat:$('evCat').value});
 save('events',events);e.target.reset();render();
};

function applyLang(){
 document.documentElement.lang=ar?'ar':'en';
 document.documentElement.dir=ar?'rtl':'ltr';
 document.querySelectorAll('[data-ar]').forEach(el=>{el.textContent=ar?el.dataset.ar:el.dataset.en});
 $('langBtn').textContent=ar?'English':'العربية';
 updLogin();render();
}
function toggleLang(){ar=!ar;applyLang()}

function route(){
 let p=(location.hash||'#/home').replace('#/','');
 if(!$(p)||!$(p).classList.contains('page'))p='home';
 if(p==='dash'&&!user){p='login'}
 document.querySelectorAll('.page').forEach(x=>x.classList.toggle('show',x.id===p));
 document.querySelectorAll('.menu a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#/'+p));
 $('menu').classList.remove('open');window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
applyLang();route();
</script>
</body>
</html>

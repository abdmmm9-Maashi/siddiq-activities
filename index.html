<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>النشاط الطلابي – ثانوية الصديق بخميس مشيط</title>

<style>
:root{--main:#1BB5C9;--dark:#0E7C8C;--white:#fff;--light:#F4FAFB;--text:#18363b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;color:var(--text);background:var(--white);line-height:1.7}
a{text-decoration:none;color:inherit}
.container{max-width:1100px;margin:auto;padding:0 20px}
header{background:linear-gradient(135deg,var(--dark),var(--main));color:var(--white);position:sticky;top:0;z-index:10}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.brand img{height:46px;display:none}
.menu{display:flex;gap:14px;flex-wrap:wrap;font-size:.92rem}
.menu a:hover,.menu a.on{text-decoration:underline}
.burger{display:none;background:none;border:2px solid #fff;color:#fff;border-radius:8px;padding:4px 10px;font-size:1.2rem;cursor:pointer}
.btns{display:flex;gap:8px}
.btn{display:inline-block;padding:9px 20px;border-radius:24px;font-weight:700;border:2px solid var(--white);cursor:pointer;font-family:inherit;font-size:.95rem}
.btn-white{background:var(--white);color:var(--dark)}
.btn-line{background:transparent;color:var(--white)}
.btn-main{background:var(--main);color:#fff;border-color:var(--main)}
.btn-red{background:#fff;color:#b33;border-color:#b33;padding:3px 12px;font-size:.8rem}
.btn-sm{background:#fff;color:var(--dark);border-color:var(--dark);padding:3px 12px;font-size:.8rem}
.hero{background:linear-gradient(135deg,var(--main),var(--dark));color:var(--white);text-align:center;padding:80px 0}
.hero h1{font-size:2.4rem;margin-bottom:10px}
.hero p{font-size:1.15rem;margin-bottom:26px;opacity:.95}
.hero .btn{margin:4px}
.page{display:none}.page.show{display:block}
section{padding:46px 0}
section.alt{background:var(--light)}
h2{color:var(--dark);margin-bottom:24px;font-size:1.6rem;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.card{background:var(--white);border:2px solid var(--main);border-radius:14px;padding:22px;text-align:center;box-shadow:0 4px 14px rgba(14,124,140,.08)}
.card h3{color:var(--dark);margin-bottom:6px}
.card small{color:#5c7a7f;display:block}
.stat b{display:block;font-size:2rem;color:var(--main)}
.img-ph{height:130px;background:var(--light);border-radius:10px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;color:#7aa;font-size:.9rem}
.gifted{background:linear-gradient(135deg,var(--dark),var(--main));color:var(--white);border-radius:18px;padding:36px;text-align:center}
.gifted h2{color:var(--white)}
.box{background:#fff;border:2px solid var(--main);border-radius:14px;padding:26px;max-width:560px;margin:auto}
label{display:block;margin:10px 0 4px;font-weight:700;color:var(--dark)}
input,select,textarea{width:100%;padding:10px;border:1px solid #9cc;border-radius:8px;font-family:inherit;font-size:1rem}
.box .btn{margin-top:16px}
.msg{margin-top:12px;padding:10px;border-radius:8px;background:#e6f8fa;color:var(--dark);display:none}
.warn{background:#fff8e1;border:1px solid #f0c040;border-radius:10px;padding:12px;margin-bottom:18px;font-size:.9rem}
table{width:100%;border-collapse:collapse;background:#fff;font-size:.92rem}
th,td{border:1px solid #cde;padding:8px;text-align:start}
th{background:var(--dark);color:#fff}
.tablewrap{overflow-x:auto;margin-bottom:24px}
.count{font-size:1.6rem;color:var(--main);font-weight:700}
.linkbtn{background:none;border:none;color:var(--dark);text-decoration:underline;cursor:pointer;font-family:inherit;margin-top:12px}
.footer{background:var(--dark);color:var(--white);padding:36px 0 18px}
.footer .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:18px}
.footer h4{margin-bottom:8px}
.footer li{list-style:none}
.note{border-top:1px solid rgba(255,255,255,.3);padding-top:14px;font-size:.85rem;text-align:center;opacity:.9}
@media(max-width:800px){.hero h1{font-size:1.7rem}.burger{display:block}.menu{display:none;width:100%;flex-direction:column}.menu.open{display:flex}}
</style>
</head>

<script>
/* ===== ضع هنا القيمتين فقط (Project URL و anon public key) ===== */
const SUPABASE_URL='ضع_Project_URL_هنا';
const SUPABASE_KEY='ضع_anon_public_key_هنا';
/* ================================================================ */

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let ar=true, user=null, profile=null, events=[], regs=[];
let inviteFlag=/type=(invite|recovery)/.test(location.hash);
const $=id=>document.getElementById(id);
const T=(a,e)=>ar?a:e;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roleName={admin:['مشرف النشاط','Supervisor'],team:['فريق النشاط','Team'],teacher:['معلم مشرف','Teacher'],gifted:['منسق الموهوبين','Gifted coordinator'],student:['طالب','Student']};
const role=()=>profile?profile.role:'student';
const staff=()=>user&&['admin','team','teacher','gifted'].includes(role());
const evTitle=e=>ar?e.title_ar:(e.title_en||e.title_ar);
const show=(id,txt)=>{const m=$(id);m.style.display='block';m.textContent=txt};

async function loadProfile(){
 if(!user){profile=null;return}
 const {data}=await sb.from('profiles').select('full_name,role').eq('id',user.id).maybeSingle();
 profile=data||{full_name:'',role:'student'};
}
async function loadAll(){
 const e=await sb.from('events').select('*').order('event_date',{ascending:false,nullsFirst:false});
 events=e.data||[];
 if(user){
  const r=await sb.from('registrations').select('*').order('created_at',{ascending:false});
  regs=r.data||[];
 }else regs=[];
}

function evCard(e){
 return '<div class="card"><div class="img-ph">'+T('صورة الفعالية','Event photo')+'</div><h3>'+esc(evTitle(e))+'</h3><small>'+esc(e.event_date||T('التاريخ يُحدَّد لاحقاً','Date TBD'))+'</small><small>'+T('المعلم المشرف: ','Teacher: ')+esc(e.teacher||'—')+'</small></div>';
}
function daysTo(m,d){const n=new Date(),t=new Date(n.getFullYear(),m,d);if(t<new Date(n.getFullYear(),n.getMonth(),n.getDate()))t.setFullYear(n.getFullYear()+1);return Math.ceil((t-n)/864e5)}

function render(){
 const pub=events.filter(e=>e.published);
 const act=pub.filter(e=>e.category==='activity'), gif=pub.filter(e=>e.category==='gifted');
 $('homeEv').innerHTML=act.slice(0,3).map(evCard).join('')||'<p style="text-align:center;grid-column:1/-1">'+T('لا توجد فعاليات منشورة بعد','No published events yet')+'</p>';
 $('evList').innerHTML=act.map(evCard).join('')||'<p style="text-align:center;grid-column:1/-1">'+T('لا توجد فعاليات منشورة بعد','No published events yet')+'</p>';
 $('giftedEv').innerHTML=gif.map(evCard).join('')||'<p style="text-align:center;grid-column:1/-1">'+T('لا توجد فعاليات بعد','No events yet')+'</p>';
 const sel=$('regEvent'),cur=sel.value;
 sel.innerHTML=pub.map(e=>'<option value="'+e.id+'">'+esc(evTitle(e))+'</option>').join('');
 if(cur)sel.value=cur;
 $('regNeed').style.display=user?'none':'block';
 $('regForm').style.display=user?'block':'none';
 $('sEv').textContent=pub.length;
 const oc=[[T('اليوم الوطني (23 سبتمبر)','National Day (23 Sep)'),8,23],[T('يوم التأسيس (22 فبراير)','Founding Day (22 Feb)'),1,22],[T('يوم العلم (11 مارس)','Flag Day (11 Mar)'),2,11]];
 $('occasions').innerHTML=oc.map(o=>'<div class="card"><h3>'+o[0]+'</h3><div class="count">'+daysTo(o[1],o[2])+'</div><small>'+T('يوم متبقٍ','days left')+'</small></div>').join('');
 renderDash();
}

function renderDash(){
 if(!user){$('dashWho').textContent=T('الرجاء تسجيل الدخول أولاً.','Please login first.');$('addBox').style.display='none';$('evManage').style.display='none';$('regRows').innerHTML='';return}
 const r=role();
 $('dashWho').textContent=T('مرحباً ','Welcome ')+(profile&&profile.full_name||user.email)+' – '+roleName[r][ar?0:1];
 $('addBox').style.display=staff()?'block':'none';
 $('evManage').style.display=r==='admin'?'block':'none';
 $('evRows').innerHTML=events.map(e=>'<tr><td>'+esc(evTitle(e))+'</td><td>'+(e.published?T('منشورة','Published'):T('مخفية','Hidden'))+'</td><td><button class="btn btn-sm" onclick="togglePub('+e.id+','+(!e.published)+')">'+(e.published?T('إخفاء','Hide'):T('نشر','Publish'))+'</button> <button class="btn btn-red" onclick="delEv('+e.id+')">'+T('حذف','Delete')+'</button></td></tr>').join('')||'<tr><td colspan="3">—</td></tr>';
 $('regRows').innerHTML=regs.map(g=>{
  const ev=events.find(e=>e.id==g.event_id);
  return '<tr><td>'+esc(ev?evTitle(ev):'—')+'</td><td>'+esc(g.student_name)+'</td><td>'+esc(g.grade)+'</td><td>'+esc(g.note)+'</td><td>'+(r==='admin'?'<button class="btn btn-red" onclick="delReg('+g.id+')">'+T('حذف','Delete')+'</button>':'')+'</td></tr>';
 }).join('')||'<tr><td colspan="5">'+T('لا توجد تسجيلات','No registrations')+'</td></tr>';
}

async function refresh(){await loadAll();render()}
async function togglePub(id,v){const {error}=await sb.from('events').update({published:v}).eq('id',id);if(error)alert(error.message);refresh()}
async function delEv(id){if(!confirm(T('حذف الفعالية وتسجيلاتها؟','Delete event and its registrations?')))return;const {error}=await sb.from('events').delete().eq('id',id);if(error)alert(error.message);refresh()}
async function delReg(id){const {error}=await sb.from('registrations').delete().eq('id',id);if(error)alert(error.message);refresh()}
async function logout(){await sb.auth.signOut();location.hash='#/home'}
function updLogin(){const b=$('loginBtn');if(user){b.href='#/dash';b.textContent=T('لوحة التحكم','Dashboard')}else{b.href='#/login';b.textContent=T('تسجيل الدخول','Login')}}

$('loginForm').onsubmit=async e=>{e.preventDefault();
 const {error}=await sb.auth.signInWithPassword({email:$('lEmail').value.trim(),password:$('lPass').value});
 $('lPass').value='';
 if(error){show('loginMsg',T('تعذّر الدخول: تحقق من البريد وكلمة السر.','Login failed: check email and password.'));return}
 location.hash='#/dash';
};
async function forgot(){
 const em=$('lEmail').value.trim();
 if(!em){show('loginMsg',T('اكتب بريدك أولاً ثم اضغط «نسيت كلمة السر».','Type your email first.'));return}
 const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
 show('loginMsg',error?error.message:T('أُرسل رابط تعيين كلمة السر إلى بريدك.','A reset link was sent to your email.'));
}
$('passForm').onsubmit=async e=>{e.preventDefault();
 const name=$('pName').value.trim();
 const {error}=await sb.auth.updateUser({password:$('pPass').value,data:{full_name:name}});
 $('pPass').value='';
 if(error){show('passMsg',error.message);return}
 await sb.from('profiles').update({full_name:name}).eq('id',user.id);
 await loadProfile();render();location.hash='#/dash';
};
$('regForm').onsubmit=async e=>{e.preventDefault();
 if(!user)return;
 const {error}=await sb.from('registrations').insert({event_id:$('regEvent').value,student_id:user.id,student_name:(profile&&profile.full_name)||user.email,grade:$('regGrade').value,note:$('regNote').value.trim()});
 if(error){show('regMsg',error.message);return}
 e.target.reset();show('regMsg',T('تم التسجيل بنجاح. شكراً لك!','Registered successfully. Thank you!'));refresh();
};
$('evForm').onsubmit=async e=>{e.preventDefault();
 if(!staff())return;
 const {error}=await sb.from('events').insert({title_ar:$('evAr').value.trim(),title_en:$('evEn').value.trim()||null,event_date:$('evDate').value||null,teacher:$('evTeacher').value.trim()||null,category:$('evCat').value,published:role()==='admin',created_by:user.id});
 if(error){alert(error.message);return}
 e.target.reset();refresh();
};

sb.auth.onAuthStateChange((ev,session)=>{
 setTimeout(async()=>{
  user=session?session.user:null;
  await loadProfile();await loadAll();updLogin();render();
  if(ev==='PASSWORD_RECOVERY'||(ev==='SIGNED_IN'&&inviteFlag)){inviteFlag=false;location.hash='#/setpass'}
  route();
 },0);
});

function applyLang(){
 document.documentElement.lang=ar?'ar':'en';
 document.documentElement.dir=ar?'rtl':'ltr';
 document.querySelectorAll('[data-ar]').forEach(el=>{el.textContent=ar?el.dataset.ar:el.dataset.en});
 $('langBtn').textContent=ar?'English':'العربية';
 const opts=$('evCat').options;opts[0].textContent=T('النشاط الطلابي','Student activity');opts[1].textContent=T('الموهوبون','Gifted');
 updLogin();render();
}
function toggleLang(){ar=!ar;applyLang()}

function route(){
 let p=(location.hash||'#/home').replace('#/','');
 if(!/^[a-z]+$/.test(p)||!$(p)||!$(p).classList.contains('page'))p='home';
 if((p==='dash'||p==='setpass')&&!user)p='login';
 document.querySelectorAll('.page').forEach(x=>x.classList.toggle('show',x.id===p));
 document.querySelectorAll('.menu a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#/'+p));
 $('menu').classList.remove('open');window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
applyLang();route();loadAll().then(render);
</script>
</body>
</html>
